<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿搭配色助手 · 上衣 / 裤子 / 鞋</title>
<style>
  :root{
    --top:#FFFFFF;
    --bottom:#1F3A64;
    --shoe:#FFFFFF;
    --skin:#E8BE9A;
    --hair:#2B2118;
    --card:#ffffff;
    --ink:#1d2129;
    --ink2:#5b6472;
    --line:#e6e8ec;
    --brand:#2f6bff;
    --shadow:0 6px 24px rgba(20,30,60,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#eef1f6 0%,#f7f8fa 240px);
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 56px}
  header h1{font-size:24px;margin:0 0 6px;letter-spacing:.5px}
  header p{margin:0;color:var(--ink2);font-size:13.5px}
  .app{display:grid;grid-template-columns:330px 1fr;gap:20px;margin-top:22px;align-items:start}
  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px}

  .figure-card{position:sticky;top:20px}
  .seg{display:flex;background:#eef0f4;border-radius:11px;padding:3px;margin-bottom:14px}
  .seg button{flex:1;border:0;background:transparent;padding:8px 0;border-radius:9px;font-size:14px;
    color:var(--ink2);cursor:pointer;font-family:inherit;transition:.18s}
  .seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .stage{background:radial-gradient(120% 80% at 50% 12%,#f7f9fc 0%,#eceff4 100%);border-radius:14px;overflow:hidden}
  .stage svg{display:block;width:100%;height:400px}
  .figure.male{display:block}
  .figure.female{display:none}
  body[data-gender="female"] .figure.male{display:none}
  body[data-gender="female"] .figure.female{display:block}

  .swatch-row{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:12px;color:var(--ink2)}
  .swatch-row .label{width:34px;flex:none}
  .dot{width:19px;height:19px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d8dce3;
    cursor:pointer;transition:.15s;display:inline-block}
  .dot:hover{transform:scale(1.12)}
  .dot.on{box-shadow:0 0 0 2px var(--brand)}
  .btns{display:flex;gap:8px;margin-top:14px}
  .btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;
    font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;transition:.16s}
  .btn:hover{border-color:#c3ccdb;background:#fafbfd}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.primary:hover{background:#2559dd}

  .part{margin-bottom:16px}
  .part-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .part-head h3{margin:0;font-size:15px}
  .part-head .cur{font-size:13px;color:var(--ink2)}
  .part-head .cur b{color:var(--ink);font-weight:600}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef1f7;color:#6b7484;letter-spacing:.3px}
  .tag.lock{background:#fff2e4;color:#b96a12}
  .unlock{flex:none;padding:3px 10px;font-size:11px;border-radius:8px;visibility:hidden}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px 8px}
  .chip{border:1px solid var(--line);border-radius:11px;padding:6px 4px 5px;text-align:center;
    cursor:pointer;background:#fff;transition:.15s;position:relative;font-family:inherit;overflow:visible}
  .chip:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(20,30,60,.09)}
  .chip .box{height:38px;border-radius:8px;border:1px solid rgba(0,0,0,.10)}
  .chip .nm{font-size:11px;color:var(--ink2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.pick{border-color:var(--brand);box-shadow:0 0 0 2px rgba(47,107,255,.16)}
  .chip.pick .nm{color:var(--brand);font-weight:600}
  .chip.rec::after{content:"推荐";position:absolute;top:-7px;right:-5px;background:#12b76a;color:#fff;
    font-size:9.5px;padding:1.5px 5px;border-radius:8px;letter-spacing:.3px;white-space:nowrap}
  .chip.pick::after{content:"已选";background:var(--brand)}
  .hint{font-size:12px;color:#8b93a2;margin:-4px 0 14px;line-height:1.7}

  .verdict{display:flex;gap:16px;align-items:flex-start;padding:2px}
  .score-wrap{position:relative;width:76px;height:76px;flex:none}
  .score{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--sc) var(--deg),#e9edf3 0)}
  .score-wrap .inner{position:absolute;inset:7px;background:#fff;border-radius:50%;display:flex;
    flex-direction:column;align-items:center;justify-content:center}
  .score-wrap .inner b{font-size:20px;line-height:1}
  .score-wrap .inner span{font-size:10px;color:#8b93a2;margin-top:2px}
  .verdict .txt{flex:1;min-width:0}
  .verdict .txt h4{margin:2px 0 7px;font-size:15px}
  .notes{margin:0;padding-left:18px;font-size:13px;color:var(--ink2);line-height:1.75}
  .occ{display:inline-block;margin-top:9px;font-size:12px;background:#eef4ff;color:#2f5fd0;padding:4px 10px;border-radius:20px}
  .bar{margin:16px 0 0;font-size:12px;color:var(--ink2)}
  .bar .row{display:flex;align-items:center;gap:9px;margin-top:7px}
  .bar .row .k{width:82px;flex:none}
  .bar .track{flex:1;height:7px;background:#eef0f4;border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#4b8bff,#12b76a);transition:width .25s}
  .bar .v{width:30px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
  footer{margin-top:18px;text-align:center;font-size:12px;color:#9aa2b1}

  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .figure-card{position:static}
    .stage svg{height:340px}
  }
</style>
</head>
<body>
<div class="wrap">

<script>
/* ========== 1. 颜色库 ========== */
function toHsl(hex){
  var r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  var mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn, l = (mx+mn)/2;
  var h = 0, s = 0;
  if (d > 0.0001){
    s = d / (1 - Math.abs(2*l - 1));
    if (mx === r) h = 60 * (((g-b)/d) % 6);
    else if (mx === g) h = 60 * ((b-r)/d + 2);
    else h = 60 * ((r-g)/d + 4);
  }
  if (h < 0) h += 360;
  return { h: h, s: s, l: l };
}
function C(name, hex){ var c = toHsl(hex); return { name: name, hex: hex, h: c.h, s: c.s, l: c.l }; }

var COLORS = {
  top: [['白','#FFFFFF'],['米白','#F1E7D6'],['浅灰','#D8DCE2'],['浅粉','#F3C9D2'],['浅蓝','#B3C9E6'],
        ['雾霾蓝','#7C9CC0'],['藏青','#1F3A64'],['黑','#1C1C1E'],['炭灰','#4C5158'],['燕麦','#E0CDAE'],
        ['卡其','#B99B6B'],['墨绿','#2E5A46'],['军绿','#5E6B4B'],['酒红','#7B2233'],['姜黄','#E2A63C'],
        ['浅紫','#CBBCE4'],['砖红','#B4462F'],['天蓝','#6FA8DC']].map(function(a){ return C(a[0],a[1]); }),
  bottom: [['黑','#1C1C1E'],['深灰','#454B54'],['浅灰','#C6CBD3'],['藏青','#22375C'],['深牛仔蓝','#35506E'],
           ['浅牛仔蓝','#7E9CC0'],['卡其','#B99B6B'],['米白','#EDE4D2'],['白','#F5F3EF'],['军绿','#5E6B4B'],
           ['棕','#6B4A34'],['浅蓝灰','#A8B6C4']].map(function(a){ return C(a[0],a[1]); }),
  shoe: [['白','#FFFFFF'],['米白','#EFE8DA'],['黑','#1C1C1E'],['深灰','#4A4F57'],['浅灰','#C6CBD3'],
         ['深棕','#5A3A24'],['驼色','#B08356'],['藏青','#22375C'],['酒红','#7B2233'],['墨绿','#2E5A46']]
         .map(function(a){ return C(a[0],a[1]); })
};

var SKINS = ['#F3D6BC','#E8BE9A','#D7A176','#A9724C','#7A4E31'];
var HAIRS = ['#1F1A16','#3A2A1E','#6B4A34','#9A6B3F','#C9A227','#8E9199'];

/* ========== 2. 配色评分 ========== */
function isNeutral(c){ return c.s < 0.20 || c.l < 0.15 || c.l > 0.90; }
function hueDiff(a,b){ var d = Math.abs(a.h - b.h) % 360; return d > 180 ? 360 - d : d; }
function clamp(v){ return Math.max(0, Math.min(100, v)); }

function pairScore(a,b){
  var s = 64, na = isNeutral(a), nb = isNeutral(b), dl = Math.abs(a.l - b.l);
  if (dl > 0.42) s += 11;
  else if (dl > 0.22) s += 15;
  else if (dl > 0.12) s += 3;
  else s -= 9;
  if (na && nb){ s += 7; if (dl < 0.12) s -= 4; }
  else if (na || nb){ s += 13; }
  else {
    var dh = hueDiff(a,b);
    if (dh < 25){ s += 13; if (dl < 0.12) s -= 5; }
    else if (dh < 55) s += 8;
    else if (dh < 95) s -= 6;
    else if (dh < 145) s -= 13;
    else { s += 9; if (a.s > 0.6 && b.s > 0.6) s -= 4; }
  }
  if (a.l < 0.30 && b.l < 0.30) s -= 5;
  if (a.s > 0.70 && b.s > 0.70 && dl < 0.15) s -= 6;
  return clamp(s);
}
function bottomShoeScore(b, sh){
  var dh = hueDiff(b, sh), s = pairScore(b, sh);
  if (isNeutral(sh)) s += 6;
  if (!isNeutral(b) && !isNeutral(sh) && dh < 25) s += 7;
  if (b.l < 0.35 && sh.l > 0.85) s += 6;
  if (b.l < 0.22 && sh.h > 15 && sh.h < 45 && sh.s > 0.30) s -= 6;
  if (sh.l > 0.85 && b.l > 0.80) s -= 3;
  return clamp(s);
}
function topShoeScore(t, sh){
  var s = pairScore(t, sh) * 0.72 + 18;
  if (!isNeutral(t) && !isNeutral(sh) && hueDiff(t, sh) < 25) s += 8;
  if (isNeutral(sh)) s += 5;
  return clamp(s);
}
function scoreOutfit(t,b,sh){
  var tb = pairScore(t,b), bs = bottomShoeScore(b,sh), ts = topShoeScore(t,sh);
  return { total: Math.round(0.44*tb + 0.32*bs + 0.24*ts), tb: Math.round(tb), bs: Math.round(bs), ts: Math.round(ts) };
}

/* ========== 3. 状态 ========== */
var PARTS = [{ key:'top', label:'上衣' }, { key:'bottom', label:'裤子' }, { key:'shoe', label:'鞋' }];
var state = {
  gender:'male', seed:0, skin:1, hair:0,
  locked:{ top:null, bottom:null, shoe:null },
  auto:{ top:null, bottom:null, shoe:null },
  pool:[],
  tie:{}
};
function current(k){ return state.locked[k] || state.auto[k]; }
var $ = function(id){ return document.getElementById(id); };

/* ========== 4. 推荐引擎 ========== */
function candidates(){
  var base = {}, free = [];
  PARTS.forEach(function(p){
    if (state.locked[p.key]) base[p.key] = state.locked[p.key];
    else free.push(p.key);
  });
  if (!free.length) return [{ top:base.top, bottom:base.bottom, shoe:base.shoe,
                              _s: scoreOutfit(base.top, base.bottom, base.shoe) }];
  var combos = [base];
  free.forEach(function(k){
    var next = [];
    combos.forEach(function(c){
      COLORS[k].forEach(function(col){
        var o = {};
        for (var key in c) o[key] = c[key];
        o[k] = col;
        next.push(o);
      });
    });
    combos = next;
  });
  return combos
    .map(function(c){ var o = { top:c.top, bottom:c.bottom, shoe:c.shoe };
                      o._s = scoreOutfit(o.top, o.bottom, o.shoe); return o; })
    .sort(function(a,b){ return b._s.total - a._s.total; })
    .slice(0, 14);
}

function updateOutfit(){
  var pool = candidates();
  state.pool = pool;
  var curKey = PARTS.map(function(p){ return current(p.key) ? current(p.key).hex : '-'; }).join('|');
  if (state.tie.key !== curKey) state.tie = {};          // 新组合重置去重
  var idx = state.seed % pool.length;
  var pick = pool[idx], chosen = pick;
  for (var i = 0; i < pool.length && !chosen._d; i++){
    var c = pool[i], dup = false;
    PARTS.forEach(function(p){ if (!state.locked[p.key] && c[p.key].hex === state.tie[p.key]) dup = true; });
    if (!dup) chosen = c;
  }
  PARTS.forEach(function(p){
    var col = state.locked[p.key] || chosen[p.key];
    state.auto[p.key] = col;
    state.tie[p.key] = col.hex;
  });
  state.tie.key = PARTS.map(function(p){ return current(p.key).hex; }).join('|');
  render();
}

/* ========== 5. 点评文案 ========== */
function buildNotes(o){
  var t = o.top, b = o.bottom, s = o.shoe, out = [];
  var dl = t.l - b.l, dh = hueDiff(t,b), nt = isNeutral(t), nb = isNeutral(b), ns = isNeutral(s);

  if (dl > 0.22) out.push('上浅下深：视觉重心下沉，稳重且显高，最不容易出错的组合。');
  else if (dl < -0.22) out.push('上深下浅：轻松休闲，只要裤子保持干净挺括就很好看。');
  else out.push('上下明度接近：整体感最强，但必须点出层次 —— 换不同材质（针织配牛仔），或用皮带、内搭、鞋包做一个颜色分隔。');

  if (nt && nb) out.push('全身中性色打底：通勤、面试的零失误底牌。');
  else if (nt || nb) out.push('中性色打底 + 一件彩色：安全，又不缺记忆点。');
  else if (dh < 25) out.push('同色系呼应：' + t.name + '与' + b.name + '同一色相不同深浅，高级耐看。');
  else if (dh >= 150) out.push('互补色对比：存在感很强，适合想被记住的场合。');
  else out.push('邻近色过渡：' + t.name + '与' + b.name + '色相相邻，柔和自然。');

  if (s.l > 0.85) out.push('浅色鞋提亮整身，春夏最讨巧；想显腿长就让鞋色接近裤色。');
  else if (!ns && hueDiff(s,b) < 25) out.push('鞋与裤同色系：腿线不被截断，视觉上显腿长。');
  else if (ns) out.push('中性色鞋款：跟全身任何一件都讲得通，闭眼不出错。');

  if (t.l < 0.35 && b.l < 0.35 && s.l < 0.35) out.push('全身偏暗：留一件浅色（内搭、袜子或鞋）提亮，避免沉闷。');

  var dark = [t,b,s].filter(function(c){ return c.l < 0.35; }).length, occ = '日常 / 休闲';
  if (dark >= 2 && ns) occ = '通勤 / 正式';
  else if (!nt && t.s > 0.35 && (t.h < 20 || t.h > 320)) occ = '约会 / 聚会';
  else if (b.name.indexOf('牛仔') >= 0 || s.l > 0.85) occ = '周末 / 出行';
  return { out: out, occ: occ };
}

/* ========== 6. 渲染 ========== */
function buildParts(){
  var html = '';
  PARTS.forEach(function(p){
    html += '<div class="part" data-part="' + p.key + '">'
         +  '<div class="part-head"><h3>' + p.label + '</h3>'
         +  '<span class="cur">当前：<b data-cur="' + p.key + '">—</b></span>'
         +  '<span class="tag" data-tag="' + p.key + '">自动推荐</span>'
         +  '<button class="btn unlock" data-unlock="' + p.key + '">取消选择</button></div>'
         +  '<div class="grid">';
    COLORS[p.key].forEach(function(c,i){
      html += '<button class="chip" data-chip="' + p.key + '" data-i="' + i + '">'
           +  '<div class="box" style="background:' + c.hex + '"></div>'
           +  '<div class="nm">' + c.name + '</div></button>';
    });
    html += '</div></div>';
  });
  $('parts').innerHTML = html + '<p class="hint">点色块 = 锁定这一件，其余两件自动重算；再点一次已选中的色块 = 取消锁定。点「换一套」在同分方案里切换。</p>';
}

function buildDots(){
  $('skin-dots').innerHTML = SKINS.map(function(c,i){
    return '<span class="dot' + (i === state.skin ? ' on' : '') + '" data-skin="' + i + '" style="background:' + c + '"></span>';
  }).join('');
  $('hair-dots').innerHTML = HAIRS.map(function(c,i){
    return '<span class="dot' + (i === state.hair ? ' on' : '') + '" data-hair="' + i + '" style="background:' + c + '"></span>';
  }).join('');
}

function render(){
  document.documentElement.style.setProperty('--top', current('top').hex);
  document.documentElement.style.setProperty('--bottom', current('bottom').hex);
  document.documentElement.style.setProperty('--shoe', current('shoe').hex);
  document.documentElement.style.setProperty('--skin', SKINS[state.skin]);
  document.documentElement.style.setProperty('--hair', HAIRS[state.hair]);
  document.body.dataset.gender = state.gender;

  PARTS.forEach(function(p){
    var cur = current(p.key), locked = !!state.locked[p.key];
    var chips = document.querySelectorAll('[data-chip="' + p.key + '"]');
    for (var i = 0; i < chips.length; i++){
      var c = COLORS[p.key][+chips[i].dataset.i];
      chips[i].classList.toggle('pick', c === cur && locked);
      chips[i].classList.toggle('rec', c === cur && !locked);
    }
    document.querySelector('[data-cur="' + p.key + '"]').textContent = cur.name;
    var tag = document.querySelector('[data-tag="' + p.key + '"]');
    tag.textContent = locked ? '已锁定' : '自动推荐';
    tag.classList.toggle('lock', locked);
    document.querySelector('[data-unlock="' + p.key + '"]').style.visibility = locked ? 'visible' : 'hidden';
  });

  var o = { top: current('top'), bottom: current('bottom'), shoe: current('shoe') };
  var sc = scoreOutfit(o.top, o.bottom, o.shoe);
  var ring = $('score-ring');
  ring.style.setProperty('--deg', (sc.total / 100 * 360) + 'deg');
  ring.style.setProperty('--sc', sc.total >= 85 ? '#12b76a' : sc.total >= 70 ? '#3b82f6' : sc.total >= 55 ? '#f59e0b' : '#ef4444');
  $('score-num').textContent = sc.total;
  $('verdict-title').textContent = sc.total >= 85 ? '很协调，直接穿出门'
    : sc.total >= 70 ? '顺眼，稳妥之选'
    : sc.total >= 55 ? '能穿，但可以更讲究' : '有点冒险，建议再换换';

  var n = buildNotes(o);
  $('notes').innerHTML = n.out.map(function(x){ return '<li>' + x + '</li>'; }).join('');
  $('occ').textContent = n.occ;
  $('bars').innerHTML = [['上衣 × 裤子', sc.tb], ['裤子 × 鞋', sc.bs], ['上衣 × 鞋', sc.ts]]
    .map(function(r){
      return '<div class="row"><span class="k">' + r[0] + '</span>'
           + '<span class="track"><span class="fill" style="width:' + r[1] + '%"></span></span>'
           + '<span class="v">' + r[1] + '</span></div>';
    }).join('');
}

/* ========== 7. 事件 ========== */
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-chip]') : null;
  if (el){
    var k = el.dataset.chip, c = COLORS[k][+el.dataset.i];
    state.locked[k] = (state.locked[k] === c) ? null : c;
    state.seed = 0; state.tie = {};
    updateOutfit(); return;
  }
  var un = e.target.closest('[data-unlock]');
  if (un){ state.locked[un.dataset.unlock] = null; state.seed = 0; state.tie = {}; updateOutfit(); return; }
  var sk = e.target.closest('[data-skin]');
  if (sk){ state.skin = +sk.dataset.skin; buildDots(); render(); return; }
  var hd = e.target.closest('[data-hair]');
  if (hd){ state.hair = +hd.dataset.hair; buildDots(); render(); return; }
});

$('g-male').addEventListener('click', function(){
  state.gender = 'male'; $('g-male').classList.add('on'); $('g-female').classList.remove('on'); render();
});
$('g-female').addEventListener('click', function(){
  state.gender = 'female'; $('g-female').classList.add('on'); $('g-male').classList.remove('on'); render();
});
$('shuffle').addEventListener('click', function(){ state.seed++; updateOutfit(); });
$('copy').addEventListener('click', function(){
  var o = { top: current('top'), bottom: current('bottom'), shoe: current('shoe') };
  var sc = scoreOutfit(o.top, o.bottom, o.shoe);
  var txt = '今日穿搭（' + (state.gender === 'male' ? '男士' : '女士') + '）：' + o.top.name + '上衣 + '
          + o.bottom.name + '裤子 + ' + o.shoe.name + '鞋　协调度 ' + sc.total + ' 分';
  if (navigator.clipboard) navigator.clipboard.writeText(txt);
  var b = $('copy'), old = b.textContent;
  b.textContent = '已复制 ✓';
  setTimeout(function(){ b.textContent = old; }, 1400);
});

buildParts();
buildDots();
updateOutfit();
</script>
</body>
</html>
